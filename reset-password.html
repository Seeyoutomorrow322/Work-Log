<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17232b">
    <meta name="description" content="비밀번호 재설정">
    <title>비밀번호 재설정 · 업무일지</title>
    <link rel="stylesheet" href="style.css?v=report-preview-bg-v2">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="reset-password.js" defer></script>
  </head>
  <body>
    <main class="auth-screen">
      <section class="auth-card" aria-labelledby="reset-title">
        <p class="auth-brand">DAILY WORK LOG</p>
        <h1 id="reset-title" class="page-title">비밀번호 재설정</h1>
        <p id="reset-status" class="auth-status" role="status">재설정 링크를 확인하고 있습니다.</p>
        <form id="reset-password-form" class="editor-form" hidden>
          <label class="field" for="new-password">
            <span class="field-label">새 비밀번호</span>
            <input class="field-control" id="new-password" name="password" type="password" autocomplete="new-password" minlength="6" required>
          </label>
          <label class="field" for="confirm-password">
            <span class="field-label">새 비밀번호 확인</span>
            <input class="field-control" id="confirm-password" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="6" required>
          </label>
          <p id="reset-error" class="auth-error" role="alert" hidden></p>
          <div class="action-bar">
            <button id="save-password-button" class="action-button action-button--primary" type="submit">비밀번호 변경</button>
          </div>
        </form>
        <a id="login-link" class="action-button action-button--secondary" href="./index.html" hidden>로그인으로 돌아가기</a>
      </section>
    </main>
  </body>
</html>
